"$schema" = 'https://starship.rs/config-schema.json'
# Prompt Catppuccin Mocha · géré dans ~/dotfiles/config/starship.toml

add_newline = true
palette = "catppuccin_mocha"
format = """
$username$hostname$directory$git_branch$git_state$git_status\
$fill\
$nodejs$python$rust$dart$swift$cmd_duration
$character"""

[username]
style_user = "bold peach"
format = "[$user]($style)[@](overlay1)"

[hostname]
style = "bold peach"
format = "[$hostname]($style) "

[directory]
style = "bold lavender"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
format = "[$path]($style)[$read_only](red) "

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_state]
style = "bold yellow"

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
conflicted = "="
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘${count}"

[fill]
symbol = " "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "yellow"
format = '[$symbol$version( \($virtualenv\))]($style) '

[rust]
symbol = "󱘗 "
style = "peach"
format = "[$symbol$version]($style) "

[dart]
symbol = " "
style = "sky"
format = "[$symbol$version]($style) "

[swift]
symbol = " "
style = "peach"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[ $duration]($style) "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
