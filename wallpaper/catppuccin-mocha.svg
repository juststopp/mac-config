<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1664" viewBox="0 0 2560 1664">
  <!-- Fond d'écran Catppuccin Mocha : dégradés doux + lignes d'ondes -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181825"/>
      <stop offset="0.55" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <radialGradient id="mauve" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cba6f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c2e7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f5c2e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="peach" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fab387" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fab387" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#cba6f7" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#f5c2e7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fab387" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1664" fill="url(#bg)"/>
  <ellipse cx="2050" cy="360" rx="1050" ry="820" fill="url(#mauve)"/>
  <ellipse cx="420" cy="1420" rx="1100" ry="760" fill="url(#blue)"/>
  <ellipse cx="1560" cy="1180" rx="760" ry="560" fill="url(#pink)"/>
  <ellipse cx="2380" cy="1520" rx="620" ry="420" fill="url(#peach)"/>

  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path stroke-width="2.4" d="M-100 1030 C 420 860, 820 1180, 1300 1010 S 2150 820, 2700 960"/>
    <path stroke-width="1.6" opacity="0.8" d="M-100 1080 C 430 920, 840 1230, 1310 1065 S 2160 880, 2700 1020"/>
    <path stroke-width="1.1" opacity="0.6" d="M-100 1130 C 440 980, 860 1280, 1320 1120 S 2170 940, 2700 1080"/>
    <path stroke-width="0.8" opacity="0.45" d="M-100 1180 C 450 1040, 880 1330, 1330 1175 S 2180 1000, 2700 1140"/>
    <path stroke-width="0.6" opacity="0.3" d="M-100 1230 C 460 1100, 900 1380, 1340 1230 S 2190 1060, 2700 1200"/>
  </g>
</svg>
